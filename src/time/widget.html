<div class="chronometer" data-hour="$1" data-minute="$2">
  <button class="watch-trigger" type="button" aria-expanded="false" aria-label="%open%">
    <span class="watch-body">
      <span class="crown" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="bow" aria-hidden="true"><i></i></span>
      <span class="case-ring">
        <span class="timepiece">
          <span class="dial-grain" aria-hidden="true"></span>
          <span class="minute-track" aria-hidden="true"></span>
          <span class="chapter chapter-12">XII</span>
          <span class="chapter chapter-3">III</span>
          <span class="chapter chapter-9">IX</span>
          <span class="phase-window" aria-hidden="true">
            <span class="phase-disc">
              <i class="phase-sun"></i>
              <i class="phase-moon"></i>
              <b class="phase-stars"></b>
            </span>
          </span>
          <span class="maker">MOMENT</span>
          <span class="hand hour-hand" aria-hidden="true"><i></i></span>
          <span class="hand minute-hand" aria-hidden="true"><i></i></span>
          <span class="hand-pin" aria-hidden="true"></span>
          <span class="balance-window" aria-hidden="true">
            <span class="balance-bridge"></span>
            <span class="balance-wheel"><i></i><i></i><i></i><i></i></span>
            <span class="balance-jewel"></span>
          </span>
          <span class="digital-time" aria-label="00:00">
            <span class="digit-window"><b>0</b></span>
            <span class="digit-window"><b>0</b></span>
            <i>:</i>
            <span class="digit-window"><b>0</b></span>
            <span class="digit-window"><b>0</b></span>
          </span>
        </span>

        <span class="watch-lid" aria-hidden="true">
          <span class="lid-metal"></span>
          <span class="lid-glass"></span>
          <span class="lid-etch"><i></i><b></b></span>
          <span class="lid-glint"></span>
          <span class="lid-inscription" aria-hidden="true">
            <span class="card-kicker">%recorded%</span>
            <strong class="moment-date">$3</strong>
            <span class="moment-passage">
              <small>%elapsed%</small>
              <b class="moment-elapsed">$4</b>
            </span>
            <span class="moment-note">$5</span>
            <i class="lid-close">%close%</i>
          </span>
        </span>
        <span class="hinge" aria-hidden="true"><i></i><i></i><i></i></span>
      </span>
    </span>
    <span class="action-label"><i class="label-open">%open%</i><i class="label-close">%close%</i></span>
  </button>
</div>
