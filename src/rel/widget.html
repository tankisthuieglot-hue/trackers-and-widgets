<article class="card">
  <div class="aura" aria-hidden="true"><i></i><i></i></div>
  <div class="frost" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="comment"><span>$2</span><i aria-hidden="true"></i></div>

  <header>
    <span class="sigil" aria-hidden="true">
      <i class="orbit o1"></i>
      <i class="orbit o2"></i>
      <i class="orbit o3"></i>
      <b class="monogram"></b>
    </span>
    <div class="identity">
      <h3>$1</h3>
      <p>$3</p>
    </div>
    <span class="heart" aria-hidden="true">♥</span>
  </header>

  <div class="signals">
    <div class="signal e-$5" data-value="$6">
      <div class="signal-head"><span class="label"></span><b><span class="value">0</span><small>%percent%</small></b></div>
      <div class="track"><i></i><em></em></div>
    </div>
    <div class="signal e-$7" data-value="$8">
      <div class="signal-head"><span class="label"></span><b><span class="value">0</span><small>%percent%</small></b></div>
      <div class="track"><i></i><em></em></div>
    </div>
    <div class="signal e-$9" data-value="$10">
      <div class="signal-head"><span class="label"></span><b><span class="value">0</span><small>%percent%</small></b></div>
      <div class="track"><i></i><em></em></div>
    </div>
  </div>

  <div class="clothes">
    <span>%wearing%</span>
    <b class="value">$4</b>
  </div>

  <div class="dictionary" hidden>
    <i data-kind="friendship">%friendship%</i>
    <i data-kind="love">%love%</i>
    <i data-kind="trust">%trust%</i>
    <i data-kind="respect">%respect%</i>
    <i data-kind="interest">%interest%</i>
    <i data-kind="fear">%fear%</i>
    <i data-kind="jealousy">%jealousy%</i>
    <i data-kind="hostility">%hostility%</i>
  </div>
</article>
