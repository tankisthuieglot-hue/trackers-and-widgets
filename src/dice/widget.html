<div class="throw o-$4">
  <div class="arena" data-bounces="0">
    <span class="die-shadow"></span>
    <button class="die" type="button" aria-label="%replay%">
      <span class="facets"></span>
      <b class="roll" data-final="$2">$2</b>
    </button>
  </div>

  <div class="read" aria-hidden="false">
    <div class="act">$1</div>

    <div class="verdict">
      <span class="word">
        <span class="w-crit">%crit%</span>
        <span class="w-pass">%pass%</span>
        <span class="w-edge">%edge%</span>
        <span class="w-fail">%fail%</span>
        <span class="w-fumble">%fumble%</span>
      </span>
      <span class="dc">%vs% <b>$3</b></span>
    </div>

    <div class="cost">$5</div>
  </div>
</div>
