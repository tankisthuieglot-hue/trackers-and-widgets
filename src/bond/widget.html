<div class="board">
  <div class="cap">%title%</div>

  <div class="field">
    <span class="ax ay">%trust%</span>
    <span class="ax ax-h">%warmth%</span>

    <span class="pin s1 wx-$2 ty-$3"><i></i><b>$1</b></span>
    <span class="pin s2 wx-$6 ty-$7"><i></i><b>$5</b></span>
    <span class="pin s3 wx-$10 ty-$11"><i></i><b>$9</b></span>
  </div>

  <ul class="tells">
    <li class="s1"><em>$1</em><span>$4</span></li>
    <li class="s2"><em>$5</em><span>$8</span></li>
    <li class="s3"><em>$9</em><span>$12</span></li>
  </ul>
</div>
